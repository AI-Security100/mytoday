<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>今日 · 我的计划中枢</title>
<style>
:root{
  --bg:#0e1116; --card:#171b23; --card2:#1e232d; --line:#2a3140;
  --fg:#e8edf5; --dim:#8b96a8; --dim2:#5f6b7d;
  --green:#3ddc84; --blue:#5aa9ff; --amber:#ffb547; --red:#ff6b6b; --violet:#b48cff;
  --safe: env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif}
body{padding-bottom:calc(64px + var(--safe))}
a{color:var(--blue)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit}

#hdr{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#12161d,#0e1116);
  border-bottom:1px solid var(--line);padding:10px 14px 8px}
.hd1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.hd-date{font-size:20px;font-weight:700;letter-spacing:.3px}
.hd-wk{font-size:14px;color:var(--blue);font-weight:600}
.hd2{margin-top:3px;font-size:12.5px;color:var(--dim);display:flex;gap:10px;flex-wrap:wrap}
.hd2 b{color:var(--fg);font-weight:600}
.hd-ev{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap}
.ev{font-size:11.5px;padding:3px 8px;border-radius:999px;border:1px solid;}
.ev.hard{color:var(--red);border-color:#5a2626;background:#2a1416}
.ev.exam{color:var(--amber);border-color:#5a441f;background:#2a2113}
.ev.class{color:var(--blue);border-color:#1f3d5c;background:#111f2e}
.ev.plan{color:var(--violet);border-color:#3d2f5c;background:#1c1730}

main{padding:12px 12px 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:11px}
.card h3{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:7px}
.card .sub{font-size:12.5px;color:var(--dim);margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.num{flex:0 0 auto;font-variant-numeric:tabular-nums;font-weight:700}
.lab{flex:1;min-width:0}
.tiny{font-size:11.5px;color:var(--dim2)}
.ok{color:var(--green)}.no{color:var(--dim2)}.warn{color:var(--amber)}.bad{color:var(--red)}
.chip{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 13px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:13.5px}
.btn:active{transform:scale(.97)}
.btn.pri{background:#14432c;border-color:#1f6b46;color:#c9ffe2}
.btn.on{background:#3a1f1f;border-color:#7a3535;color:#ffd6d6}
.btn.wide{width:100%;padding:13px;font-size:16px;font-weight:700}
.btn[disabled]{opacity:.45}
.big{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.two{display:flex;gap:8px}.two>*{flex:1}

body.hasc{padding-bottom:calc(168px + var(--safe))}
#ck{display:none;position:fixed;left:0;right:0;bottom:calc(64px + var(--safe));z-index:15;
  padding:8px 12px 10px;background:#12161df2;backdrop-filter:blur(8px);border-top:1px solid var(--line)}
#ck .l{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--dim);margin-bottom:8px;flex-wrap:wrap}
#ck .l span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}
#ck .l span.ok{color:var(--green);border-color:#1f6b46;background:#12291d}
#ck .l i{width:7px;height:7px;border-radius:50%;background:var(--dim2);display:inline-block;margin-right:4px}
#ck .l i.g{background:var(--green)}
#ck .self{font-size:11px;color:var(--blue);text-decoration:underline;margin-bottom:7px;display:inline-block}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:#12161d;border-top:1px solid var(--line);padding-bottom:var(--safe)}
#tabs button{flex:1;padding:9px 0 10px;font-size:11.5px;color:var(--dim2);display:flex;
  flex-direction:column;align-items:center;gap:2px}
#tabs button .ico{font-size:17px;line-height:1}
#tabs button.on{color:var(--green)}

.subwrap{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;overflow:auto;padding-bottom:24px}
.subwrap.show{display:block}
.subnav{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;
  padding:11px 14px;background:#12161dee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.subnav .bk{font-size:20px;line-height:1;padding:2px 6px;color:var(--green)}
.subnav .ttl{font-size:15px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subbody{padding:13px 14px}

.sent{display:flex;gap:9px;padding:8px 0;border-top:1px solid var(--line);align-items:flex-start}
.sent:first-child{border-top:0}
.sent .ix{flex:0 0 20px;font-size:11px;color:var(--dim2);padding-top:2px}
.sent .tx{flex:1;min-width:0;font-size:13.5px;word-break:break-word}
.sent.now .tx{color:#062;background:#3ddc84;border-radius:6px;padding:1px 5px;margin:-1px -5px;color:#052e1a;font-weight:700}
.sent .tag{font-size:10.5px;color:var(--dim2);border:1px solid var(--line);border-radius:999px;padding:1px 6px;flex:0 0 auto}

.en{font-size:15.5px;line-height:1.5}
.zh{font-size:12.5px;color:var(--dim);margin-top:2px}
.q{border-left:3px solid var(--green);padding-left:10px;margin:11px 0}

.cal{width:100%;border-collapse:collapse}
.cal th{font-size:11px;color:var(--dim2);font-weight:500;padding:4px 0}
.cal td{padding:0;text-align:center}
.cell{position:relative;height:44px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;border-radius:9px;font-size:13.5px;font-variant-numeric:tabular-nums}
.cell.today{outline:2px solid var(--blue)}
.cell.mute{color:var(--dim2);opacity:.45}
.dots{display:flex;gap:2px;margin-top:2px;height:6px}
.dots i{width:5px;height:5px;border-radius:50%}
.dots i.g{background:var(--green)}.dots i.a{background:var(--amber)}
.dots i.b{background:var(--blue)}.dots i.r{background:var(--red)}
.cell.ck{background:#12301f}

.bar{height:7px;background:var(--card2);border-radius:99px;overflow:hidden;margin:6px 0}
.bar>i{display:block;height:100%;background:var(--green)}
.heat{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--card2)}
.heat i.g{background:var(--green)}
.heat i.b{background:#2b4a2f}

#toast{position:fixed;left:50%;bottom:calc(140px + var(--safe));transform:translateX(-50%);
  background:#000000e0;color:#fff;padding:9px 15px;border-radius:999px;font-size:13px;
  z-index:99;opacity:0;pointer-events:none;transition:opacity .2s;max-width:86vw;text-align:center}
#toast.show{opacity:1}
.sw{display:flex;gap:6px}
.sw button{flex:1;padding:8px;border:1px solid var(--line);border-radius:9px;font-size:13px;background:var(--card2)}
.sw button.on{border-color:var(--green);color:#c9ffe2;background:#14432c}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.kv:first-child{border-top:0}
.kv span:last-child{color:var(--dim)}
</style>
</head>
<body>

<header id="hdr">
  <div class="hd1"><span class="hd-date" id="hDate">—</span><span class="hd-wk" id="hWk"></span></div>
  <div class="hd2" id="hSub"></div>
  <div class="hd-ev" id="hEv"></div>
</header>

<main id="main"></main>

<div id="ck"></div>

<nav id="tabs">
  <button data-t="today"><span class="ico">📌</span>今天</button>
  <button data-t="cal"><span class="ico">📅</span>日历</button>
  <button data-t="plan"><span class="ico">🗂</span>计划</button>
  <button data-t="prog"><span class="ico">📈</span>进度</button>
  <button data-t="set"><span class="ico">⚙️</span>设置</button>
</nav>

<div class="subwrap" id="sub">
  <div class="subnav"><button class="bk" id="subBack">‹</button><div class="ttl" id="subTtl">—</div></div>
  <div class="subbody" id="subBody"></div>
</div>

<div id="toast"></div>
<audio id="au" preload="none"></audio>

<script>
/* 自动生成：口语 30 天数据（源自 kai30） */
var K30=[{"d":1,"md":"9/14","t":"自我介绍骨架","out":"3 句版自我介绍：Who I am / What I do / Why here","ask":"Hi, I'm Alan from Shanghai. Let me practise introducing myself. Ask me about my work first.","mat":"saic","seg":1,"sk":[["I work in data security at a retail platform.","我在一家零售平台做数据安全。"],["My background is in audit and risk.","我的背景是审计和风险。"],["I'm here to work across borders.","我来这里是为了做跨境的事。"]],"traps":[["我在一家零售平台做数据安全","I work in data security at a retail platform"],["我是做审计出身的","I started as an auditor"]]},{"d":2,"md":"9/15","t":"我的工作：数据安全做什么","out":"60 秒讲清我的岗位","ask":"Let's talk about my job in data security. Ask me what I actually do every day.","mat":"saic","seg":2,"sk":[["I'm responsible for our data security programme.","我负责公司的数据安全项目。"],["Day to day, I review risks and work with engineers.","日常我评估风险，和工程师一起干活。"],["The main challenge is balancing speed and control.","最大的挑战是平衡速度和管控。"]],"traps":[["我负责集团的隐私合规","I'm responsible for privacy compliance across the group"],["这涉及大量跨部门协调","It involves a lot of cross-team coordination"]]},{"d":3,"md":"9/16","t":"我的背景：审计 → 数据安全","out":"60 秒转折故事","ask":"I want to tell the story of how I moved from audit into data security. Ask me why I switched.","mat":"saic","seg":3,"sk":[["I started as an auditor.","我最初是做审计的。"],["Then I moved into data security.","后来我转到数据安全。"],["I made the switch because I wanted to fix problems earlier.","我转行是因为想更早介入问题。"]],"traps":[["我转行是想更早介入问题","I switched because I wanted to get involved earlier"],["这段经历给了我不同视角","That gave me a different angle"]]},{"d":4,"md":"9/17","t":"为什么读 MBA","out":"60 秒动机陈述","ask":"Ask me why I decided to do an MBA and what I'm hoping to get out of it.","mat":"saic","seg":4,"sk":[["I decided to do an MBA.","我决定读 MBA。"],["The reason is I want a broader business view.","原因是我想有更宽的业务视角。"],["Long term, I want to lead cross-border projects.","长期我想负责跨境项目。"]],"traps":[["我想要更宽的商业视角","I'm looking for a broader business perspective"],["长期我想负责跨境项目","Long term, I want to lead cross-border projects"]]},{"d":5,"md":"9/18","t":"我的公司和行业","out":"60 秒行业简介","ask":"Let's talk about my industry — instant retail and e-commerce in China. Ask me how it's changing.","mat":"saic","seg":5,"sk":[["The company I work for is a large retail platform.","我所在的公司是一家大型零售平台。"],["We're in the business of instant retail.","我们做的是即时零售。"],["The industry is changing fast, especially with AI.","这个行业变化很快，尤其是 AI。"]],"traps":[["我们是做即时零售的","We're in the business of instant retail"],["跟五年前比，一切都数据驱动了","Compared with five years ago, everything is data-driven"]]},{"d":6,"md":"9/19","t":"保底版（今天有政治课+开卷考）","out":"60 秒自我介绍初稿（今天只做 60 分钟）","ask":"Quick session today — I only have an hour. Start with: ask me to introduce myself in 60 seconds.","mat":"saic","seg":6,"sk":[["I have an exam today, so I can only practise for an hour.","我今天有考试，只能练一小时。"],["Let me keep it short and simple.","我练短一点、简单一点。"],["I'll do the introduction again tomorrow.","自我介绍我明天再来一遍。"]],"traps":[["我今天有考试，所以只能练一小时","I have an exam today, so I can only practise for an hour"]]},{"d":7,"md":"9/20","t":"验收 1：无稿 60 秒","out":"不看稿 60 秒自我介绍，卡壳 ≤3 次","ask":"Time for my Day 7 check. Interview me like a classmate meeting me for the first time.","mat":"saic","seg":1,"sk":[["Who I am: I'm Alan, and I work in data security.","我是谁：我是 Alan，做数据安全。"],["What I do: I'm responsible for our data security programme.","我做什么：我负责公司的数据安全项目。"],["Why I'm here: I want to work across borders.","我为什么在这：我想做跨境的事。"]],"traps":[["我卡壳的时候会停下来","I tend to freeze when I get stuck"],["让我重新说一遍","Let me try that again"]]},{"d":8,"md":"9/21","t":"话题① 数据安全为什么是商业问题","out":"2 分钟独白（第 1 遍：先写 10 句）","ask":"Topic: why data security is a business issue, not just an IT issue. Let me speak first, then ask me questions.","mat":"r3","seg":1,"sk":[["Data security is a business issue, not just an IT issue.","数据安全是商业问题，不只是 IT 问题。"],["A breach can lose customer trust overnight.","一次泄露能一夜之间丢掉客户信任。"],["That's why it belongs on the management agenda.","所以它应该进管理层议程。"]],"traps":[["数据泄露会一夜之间丢掉客户信任","A breach can lose customer trust overnight"],["它应该进入管理层议程","It belongs on the management agenda"]]},{"d":9,"md":"9/22","t":"话题① 加固（去掉稿子）","out":"2 分钟独白（第 2 遍：只看关键词）","ask":"Ask me the same question as yesterday: why is data security a business issue? Push me if I'm vague.","mat":"r3","seg":2,"sk":[["Let me give the conclusion first, then the reason.","我先说结论，再给理由。"],["The main thing is: trust is a business asset.","主要是：信任是商业资产。"],["For example, we now review every new vendor.","比如，我们现在每个新供应商都要审。"]],"traps":[["我先说结论，再给理由","Let me give the conclusion first, then the reason"],["举个我们自己的例子","Let me use an example from our own company"]]},{"d":10,"md":"9/23","t":"话题② 合规：从成本变成资产","out":"2 分钟独白（第 1 遍：先写 10 句）","ask":"Topic: compliance turning from a cost into an asset. Let me speak for two minutes, then question me.","mat":"r3","seg":3,"sk":[["It used to be seen as a cost centre.","过去它被看作成本中心。"],["Now people see it as an asset.","现在人们把它看作资产。"],["In the long run, trust is cheaper than fines.","长期看，信任比罚款便宜。"]],"traps":[["过去它被看作成本中心","It used to be seen as a cost centre"],["长期看，信任比罚款便宜","In the long run, trust is cheaper than fines"]]},{"d":11,"md":"9/24","t":"话题② 加固","out":"2 分钟独白（第 2 遍：脱稿）","ask":"Challenge my view that compliance can be an advantage. Disagree with me and make me defend it.","mat":"r3","seg":4,"sk":[["I'd argue that compliance is a competitive advantage.","我认为合规是一种竞争优势。"],["Companies that invest early avoid the mess later.","早投入的公司在后面就少收拾烂摊子。"],["So for me, doing it early pays off.","所以对我来说，早做是划算的。"]],"traps":[["我不太同意这个说法，因为……","I'm not sure I agree, because…"],["让我把它说得更具体一点","Let me be more specific"]]},{"d":12,"md":"9/25","t":"话题③ AI 时代还需要审计吗","out":"2 分钟独白（第 1 遍）","ask":"Topic: do we still need auditing in the age of AI? Let me answer first, then interrogate me.","mat":"r3","seg":5,"sk":[["AI changes what we do, not whether we do it.","AI 改变我们做什么，不是要不要做。"],["What matters is who is accountable.","重要的是谁来负责。"],["We still need to check the output.","我们仍然需要检查输出。"]],"traps":[["AI 改变的是做什么，不是要不要做","AI changes what we do, not whether we do it"],["重要的是谁来负责","What matters is who is accountable"]]},{"d":13,"md":"9/26","t":"话题③ 加固","out":"2 分钟独白（第 2 遍：脱稿）","ask":"Ask me: what did your company learn from deploying an AI model? Make me tell a concrete story.","mat":"r3","seg":6,"sk":[["In my case, we deployed a model last year.","就我而言，我们去年上线了一个模型。"],["The lesson was to involve risk early.","教训是要早点让风控介入。"],["Since then, we run a quick review first.","从那以后我们先做快速评估。"]],"traps":[["去年我们上线了一个模型","In my case, we deployed a model last year"],["从那以后我们先做快速评估","Since then, we run a quick review first"]]},{"d":14,"md":"9/27","t":"验收 2：2 分钟专业独白","out":"任选一题，2 分钟无稿","ask":"Day 14 check. Pick one of my three topics at random and interview me for 5 minutes.","mat":"r3","seg":1,"sk":[["Let me take one of the three topics.","我从三个话题里挑一个。"],["I'll give my point first, then the reason.","我先给观点，再给理由。"],["That's my view. Does that make sense?","这就是我的看法，说得通吗？"]],"traps":[["给我两秒钟想一下","Give me a second to think"],["我换个说法","Let me put it another way"]]},{"d":15,"md":"9/28","t":"案例 A：SAIC-双龙英文复述","out":"90 秒案例复述","ask":"I'll retell the SAIC–SsangYong case in English. Listen, then ask me what I think they got wrong.","mat":"r6","seg":1,"sk":[["This is the SAIC and SsangYong case from 2004.","这是 2004 年上汽和双龙的案例。"],["The acquisition failed because integration was rushed.","这次收购失败是因为整合太仓促。"],["The lesson was to involve risk early.","教训是要早点让风控介入。"]],"traps":[["这次并购失败是因为整合太仓促","The acquisition failed because integration was rushed"],["表面上看起来是价格问题","On the surface it looked like a price problem"]]},{"d":16,"md":"9/29","t":"案例 A：加观点","out":"90 秒复述 + 90 秒观点","ask":"Disagree with my take on the SAIC case. Play a classmate who thinks culture was a convenient excuse.","mat":"r6","seg":2,"sk":[["Building on what you said, I'd add one thing.","接着你说的，我补充一点。"],["I think the real issue is leadership.","我认为真正的问题是领导力。"],["If I were them, I'd have kept the local team.","如果我是他们，我会保留本地团队。"]],"traps":[["我认为真正的问题是领导力","I think the real issue is leadership"],["如果我是他们，我会保留本地团队","If I were them, I'd have kept the local team"]]},{"d":17,"md":"9/30","t":"案例 B：美的-库卡 + 霍夫斯泰德","out":"90 秒观点（用六维度说）","ask":"Let's discuss the Midea–KUKA case using Hofstede's six dimensions. Ask me which dimension mattered most.","mat":"r6","seg":3,"sk":[["Let me use Hofstede's six dimensions.","我用霍夫斯泰德六个维度来看。"],["The dimension that stands out is power distance.","最突出的一维是权力距离。"],["That explains why meetings felt so different.","这就解释了为什么开会感觉完全不同。"]],"traps":[["最突出的一维是权力距离","The dimension that stands out is power distance"],["这就解释了为什么开会感觉完全不同","That explains why meetings felt so different"]]},{"d":18,"md":"10/1","t":"案例 B：加固 + 两案对比","out":"2 分钟对比两个案例","ask":"Compare the two cases for me. Ask me: why did one fail and one work?","mat":"r6","seg":4,"sk":[["Both cases show culture was underestimated.","两个案例都显示文化被低估了。"],["One worked and one failed. The difference is pace.","一个成了一个没成，差别在节奏。"],["So the key variable is how you stage the integration.","所以关键变量是你怎么分阶段整合。"]],"traps":[["两者的共同点是……","What they have in common is…"],["关键变量是整合的节奏","So the key variable is the pace of integration"]]},{"d":19,"md":"10/2","t":"提问训练：会问才有存在感","out":"写出并说出 3 个英文问题","ask":"Now reverse it: I ask the questions. Play a guest speaker who just gave a talk, and let me interview you.","mat":"r6","seg":5,"sk":[["Could you elaborate on that?","能展开说说吗？"],["How does that work in practice?","这在实践中怎么运作？"],["What's the implication for our team?","这对我们团队意味着什么？"]],"traps":[["我想追问一下","May I ask a follow-up?"],["这对我们学校的情况意味着什么？","What's the implication for our school?"]]},{"d":20,"md":"10/3","t":"同意 / 反对的礼貌说法","out":"90 秒「我有不同看法」","ask":"Take a position I'll disagree with, and make me disagree politely three times.","mat":"r6","seg":6,"sk":[["That's a good point, and I'd add one thing.","说得好，我补充一点。"],["I see it differently, though.","不过我的看法不同。"],["That may be true, but it misses the cost.","这可能是对的，但它忽略了成本。"]],"traps":[["这可能是对的，但它忽略了成本","That may be true, but it misses the cost"],["这是一种看法，但我更倾向于……","That's one way to look at it, but I lean towards…"]]},{"d":21,"md":"10/4","t":"验收 3：完整英文问题","out":"说出 3 个完整、自然的英文问题","ask":"Day 21 check. Give me a short talk on any business topic, and I'll ask you three real questions.","mat":"r6","seg":1,"sk":[["Let me make sure I got that right.","我确认一下我没理解错。"],["So you mean the cost was the trigger?","你是说成本是导火索？"],["What's your take on that?","你怎么看这件事？"]],"traps":[["我确认一下我理解得对不对","Let me make sure I got that right"],["你能再展开说一下吗？","Could you elaborate on that?"]]},{"d":22,"md":"10/5","t":"救场句：听不懂也不崩","out":"故意被快语速轰炸 30 分钟不崩","ask":"From now on speak fast and don't slow down. I'll try to keep up and use my rescue sentences.","mat":"r8","seg":1,"sk":[["Sorry, I didn't catch that.","抱歉，我没听清。"],["Could you say that again, a bit slower?","能再说一遍，慢一点吗？"],["Let me make sure I got that right.","我确认一下我没理解错。"]],"traps":[["抱歉，我没听清","Sorry, I didn't catch that"],["我没太跟上，能换个说法吗？","I'm not sure I follow — could you rephrase?"]]},{"d":23,"md":"10/6","t":"接半句：听不懂也能参与","out":"用「半句接话」参与 10 次","ask":"Keep talking fast. I'll jump in with half sentences instead of full answers. Test me.","mat":"r8","seg":2,"sk":[["Right, and that's the part nobody plans for.","对，而且这部分没人提前规划。"],["Can I jump in here?","我能插一句吗？"],["That makes sense, and it applies here too.","有道理，而且这里也适用。"]],"traps":[["对，而且……","Right, and…"],["我能插一句吗？","Can I jump in here?"]]},{"d":24,"md":"10/7","t":"即兴训练（3 × 60 秒）","out":"3 个随机题，各直说 60 秒，不准备","ask":"Give me three random business questions, one at a time. I'll answer each in 60 seconds with no preparation.","mat":"r8","seg":3,"sk":[["Let me think out loud.","我边想边说。"],["Three things come to mind.","我想到三点。"],["Honestly, I'm not sure, but I'd start with the data.","说实话我不确定，但我会从数据开始。"]],"traps":[["我边想边说","Let me think out loud"],["简单说，主要是……","To put it simply, the main thing is…"]]},{"d":25,"md":"10/8","t":"即兴训练（加难度）","out":"3 个随机题 + 每题被追问 2 次","ask":"Three random questions, and after each answer challenge me twice with 'Why?' and 'Give an example.'","mat":"r7","seg":1,"sk":[["The main reason is cost.","主要原因是成本。"],["Let me give you a concrete case.","我举个具体的例子。"],["So that's why I think so.","所以我认为是这样。"]],"traps":[["主要原因是……","The main reason is…"],["我举个具体例子","Let me give you a concrete case"]]},{"d":26,"md":"10/9","t":"全真模拟：被老师点名","out":"模拟「Liu, what do you think?」2 轮","ask":"Act as a professor who suddenly calls on me: 'Liu, what do you think about this case?' Do it twice.","mat":"r7","seg":2,"sk":[["Thank you, professor. That's an interesting question.","谢谢老师，这是个有意思的问题。"],["I'd approach it from two sides.","我从两方面看。"],["From the data side, and from the business side.","从数据角度，还有从业务角度。"]],"traps":[["这是个有意思的问题","That's an interesting question"],["我从两方面看这个问题","I'd approach it from two sides"]]},{"d":27,"md":"10/10","t":"全真模拟：被追问「为什么」","out":"连续扛住 3 次追问","ask":"Ask me one question and then push me three times with 'Why?'. Don't let me off easy.","mat":"r7","seg":3,"sk":[["The main reason is the cost of trust.","主要原因是信任的成本。"],["That's based on my own experience.","这是基于我自己的经验。"],["If I may add one more thing.","我再补一点。"]],"traps":[["基于我自己的经验……","That's based on my own experience"],["我再补一点","If I may add one more thing"]]},{"d":28,"md":"10/11","t":"模拟小组讨论：连说 3 轮","out":"小组讨论录音，发言 ≥3 轮","ask":"Simulate a four-person group discussion. Play three classmates. Interrupt me, and make sure I speak at least three times.","mat":"r5","seg":1,"sk":[["Can I jump in here?","我能插一句吗？"],["Building on what he said, I'd add one thing.","接着他说的，我补充一点。"],["I'd push back on that a little.","我对此有点异议。"]],"traps":[["我能插一句吗？","Can I jump in here?"],["接着他说的，我补充一点","Building on what he said, I'd add…"]]},{"d":29,"md":"10/12","t":"回听对比 + 抽 50 句应急卡","out":"抽出 50 句「我真会用」的句子","ask":"Listen to my summary, then tell me what was unclear and ask me three checking questions.","mat":"r5","seg":2,"sk":[["My go-to sentence is: let me think out loud.","我最常用的说法是：我边想边说。"],["The biggest change this month is I speak first, then fix it.","这个月最大的变化是我先说出来，再修。"],["I'm still not perfect, but I keep going.","我还不完美，但我在继续。"]],"traps":[["我最常用的说法是……","My go-to sentence is…"],["这个月最大的变化是……","The biggest change this month is…"]]},{"d":30,"md":"10/13","t":"结业：3 分钟自由陈述","out":"自选题目，连续说 3 分钟不中断","ask":"Final session. Pick any business topic you like, interview me for 10 minutes, and don't go easy.","mat":"r5","seg":3,"sk":[["Let me pick a topic and speak for three minutes.","我挑个话题说三分钟。"],["First, second, third.","第一，第二，第三。"],["To sum up, speaking is now a habit, not a task.","总结一下，开口现在是习惯，不是任务。"]],"traps":[["我还不完美，但是……","I'm still not perfect, but…"],["现在我先把话说出来，再修","Now I speak first, then fix it"]]}];

    toast('此浏览器不支持录音（微信内置常见）→ 用 Safari/Chrome 打开'); return;

    h += '<i class="' + (S.ck[k] ? 'g' : (dayNoOf(k) ? 'b' : '')) + '" title="' + k + '"></i>';
  }
  h += '</div><div class="tiny" style="margin-top:8px">绿=已打卡 · 深绿=口语计划日但未打卡 · 灰=无计划</div></div>';

  h += '<div class="card"><h3>🛡 AI 安全条目</h3>';
  AI_SEC.months.forEach(m => {
    const done = asDoneCount(m), tot = m.tasks.length;
    h += '<div class="row"><span class="num tiny">' + m.m.slice(2) + '</span><span class="lab">' + esc(m.t)
      + '<div class="bar" style="margin:4px 0 0"><i style="width:' + Math.round(done / tot * 100) + '%"></i></div></span>'
      + '<span class="chip">' + done + '/' + tot + '</span></div>';
  });
  h += '</div>';

  if (keys.length) {
    h += '<div class="card"><h3>📝 打卡明细</h3>';
    keys.slice(-14).reverse().forEach(k => {
      const c = S.ck[k];
      h += '<div class="row"><span class="num tiny">' + k.slice(5) + '</span><span class="lab">' + wk(k) + ' · 跟读 ' + mmss(c.read || 0) + ' / 对话 ' + mmss(c.talk || 0) + ' / 录音 ' + (c.rec || 0) + 's</span><span class="chip">' + (c.full ? '满勤' : '底线') + '</span></div>';
    });
    h += '</div>';
  }
  $('#main').innerHTML = h;
}

/* ---------- 渲染：设置 ---------- */
function renderSet() {
  let h = '<div class="card"><h3>⚙️ 设置</h3>';
  h += '<div class="kv"><span>声音</span><span>' + (S.voice === 'ava' ? '女声 Ava' : '男声 Andrew') + '</span></div>';
  h += '<div class="sw" style="margin-bottom:10px"><button class="' + (S.voice === 'ava' ? 'on' : '') + '" onclick="setV(\'ava\')">女声 Ava</button><button class="' + (S.voice === 'andrew' ? 'on' : '') + '" onclick="setV(\'andrew\')">男声 Andrew</button></div>';
  h += '<div class="kv"><span>朗读速度</span><span>' + S.rate + '×</span></div>';
  h += '<div class="sw"><button class="' + (S.rate === 0.7 ? 'on' : '') + '" onclick="setR(0.7)">0.7</button><button class="' + (S.rate === 0.85 ? 'on' : '') + '" onclick="setR(0.85)">0.85</button><button class="' + (S.rate === 1 ? 'on' : '') + '" onclick="setR(1)">1.0</button><button class="' + (S.rate === 1.15 ? 'on' : '') + '" onclick="setR(1.15)">1.15</button></div>';
  h += '</div>';

  h += '<div class="card"><h3>🔒 打卡规则</h3>';
  h += '<div class="sub">' + (S.strict ? '严格模式：软项也必须有（对话 30′ / AI 安全 / 学业）' : '底线模式：跟读 25′ + 音频听完 + 录音 ≥30 秒 即可打卡') + '</div>';
  h += '<div class="sw"><button class="' + (!S.strict ? 'on' : '') + '" onclick="setStrict(false)">底线模式</button><button class="' + (S.strict ? 'on' : '') + '" onclick="setStrict(true)">严格模式</button></div>';
  h += '<div class="tiny" style="margin-top:10px">硬证据（红）：跟读前台计时、音频听完一遍、开口录音 —— 没法糊弄。<br>软项（黄）：对话计时（要切到豆包，只能墙钟计时）、AI 安全次数、学业确认。</div>';
  h += '</div>';

  h += '<div class="card"><h3>🔔 提醒</h3><div class="sub">网页版不能主动推送通知。建议手机日历每天设一个「' + S.remind + ' 打开今日打卡」的重复提醒。</div>';
  h += '<div class="sw"><button class="" onclick="alert(\'在 iPhone「时钟→闹钟」或「日历→新建重复事件」设每天 ' + S.remind + ' 即可\')">查看设置方法</button></div></div>';

  h += '<div class="card"><h3>💾 数据</h3><div class="tiny">全部数据只存在这台手机的浏览器里，不上传、无账号。</div>';
  h += '<div class="two" style="margin-top:10px"><button class="btn" onclick="exportData()">导出 JSON</button><button class="btn" onclick="wipe()">清空全部</button></div></div>';

  h += '<div class="card"><h3>🔄 内容更新</h3><div class="sub">课程 / 考试 / 截止日 / AI 安全条目都放在 data.json 里，改完刷新即生效，不用换链接。</div>';
  h += '<div class="kv"><span>内容版本</span><span>' + esc(DATA_VER || '—') + '</span></div>';
  h += '<div class="kv"><span>最近同步</span><span>' + (S.lastSync ? S.lastSync : '—') + '</span></div>';
  h += '<button class="btn pri" style="width:100%;margin-top:10px" onclick="pullRemote(true)">检查更新</button></div>';

  h += '<div class="card"><h3>ℹ️ 关于</h3><div class="tiny">今日 · 我的计划中枢<br>把口语 30 天、AI 安全 12 个月、学业课程考试放进一个页面。<br>跟读音频复用已上线的神经语音包。</div></div>';
  $('#main').innerHTML = h;
}
function setV(v) { S.voice = v; save(); if (curD) { const p = au.paused; au.src = audioURL(curD); if (!p) au.play().catch(() => { }); } renderSet(); }
function setR(r) { S.rate = r; au.playbackRate = r; save(); renderSet(); }
function setStrict(v) { S.strict = v; save(); renderSet(); renderCk(); }
function exportData() {
  const blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'hub-backup-' + today() + '.json'; a.click();
  toast('已导出');
}
function wipe() { if (confirm('清空全部打卡与进度？不可恢复')) { S = blank(); save(); renderAll(); toast('已清空'); } }
function acadCk() { S.acad[today()] = !S.acad[today()]; save(); renderAll(); }

/* ---------- 二级页 ---------- */
function showSub(kind, arg) {
  if (kind === 'month') curMonthSub = arg;
  $('#sub').classList.add('show');
  const B = $('#subBody'), T = $('#subTtl');
  window.scrollTo(0, 0); $('#sub').scrollTop = 0;
  if (kind === 'day') {
    const n = +arg, d = kd(n);
    T.textContent = 'Day ' + n + ' · ' + (d ? d.t : '');
    const au2 = K30AUDIO[n] || {}, vv = au2[S.voice] ? S.voice : 'ava';
    const sec = au2[vv] ? au2[vv].sec : 0;
    let h = '<div class="card"><h3>🎧 当日音频 · ' + sec + ' 秒</h3>';
    h += '<div class="sub">' + (d ? esc(d.md) + ' · 今天产出：' + esc(d.out) : '') + '</div>';
    h += '<div class="two"><button class="btn pri" onclick="playAudio(' + n + ')">▶ 播放 / 继续</button><button class="btn" onclick="pauseAudio()">⏸ 暂停</button></div>';
    h += '<div class="two" style="margin-top:8px"><button class="btn" onclick="playAudio(' + n + ',0)">↺ 从头</button><button class="btn ' + (S.day.run === 'read' ? 'on' : 'pri') + '" onclick="toggleTimer(\'read\')">' + (S.day.run === 'read' ? '跟读计时中 · 暂停' : '开始跟读计时') + '</button></div>';
    h += '<div class="tiny" style="margin-top:9px">今日跟读 <b id="tm-read">' + mmss(S.day.read) + '</b> / 25:00 ｜ 音频 ' + (S.day.aud >= 1 ? '<b class="ok">已听完 1 遍</b>' : '未听完') + '</div>';
    h += '<div class="two" style="margin-top:9px"><button class="btn ' + (mr && mr.state === 'recording' ? 'on' : '') + '" onclick="recToggle()">' + (mr && mr.state === 'recording' ? '停止录音' : '🎙 录音（开口）') + '</button><button class="btn" onclick="toast(\'录音只做本地时长校验，不上传、不保存文件\')">?</button></div>';
    h += '<div class="tiny" style="margin-top:6px">录音本次 <b id="tm-rec">' + (S.day.rec || 0) + '</b> 秒（需 ≥30 秒）</div>';
    h += '</div>';

    h += '<div class="card"><h3>📖 跟读句子（点句子跳过去）</h3>';
    const L = sentLabels(n);
    L.forEach((lab, i) => {
      const tag = lab === 'm' ? '材料' : lab === 'ask' ? '开场句' : lab === 'trap' ? '卡壳' : '三句话';
      const tx = lab === 'm' ? '材料第 ' + (i + 1) + ' 句' :
        (lab === 'ask' ? esc(d.ask) : esc(sentText(n, lab, lab === 'trap' ? (i - (L.length - 6) - 1) : (i - (L.length - 3)))));
      h += '<div class="sent" data-i="' + i + '" onclick="seekSent(' + n + ',' + i + ')"><span class="ix">' + (i + 1) + '</span><span class="tx"' + (lab === 'm' ? ' style="color:var(--dim)"' : '') + '>' + tx + '</span><span class="tag">' + tag + '</span></div>';
    });
    h += '<div class="tiny" style="margin-top:8px">材料全文在 kai30 里，这里给的是音频 + 今天要说的核心句。</div></div>';

    h += '<div class="card"><h3>⭐ 今天带走的 3 句</h3>';
    (d.sk || []).forEach(s => {
      h += '<div class="q"><div class="en">' + esc(s[0]) + '</div><div class="zh">' + esc(s[1]) + '</div></div>';
    });
    const skTxt = (d.sk || []).map(x => x[0]).join(' ');
    h += '<button class="btn" style="width:100%;margin-top:8px" onclick="copyIdx(' + buf(skTxt) + ')">复制三句</button></div>';

    h += '<div class="card"><h3>⚠️ 预判卡壳</h3>';
    (d.traps || []).forEach(t => { h += '<div class="q" style="border-color:var(--amber)"><div class="zh">' + esc(t[0]) + '</div><div class="en">' + esc(t[1]) + '</div></div>'; });
    h += '</div>';

    h += '<div class="card"><h3>💬 给豆包的开场句</h3><div class="q">' + esc(d.ask) + '</div>'
      + '<button class="btn pri" style="width:100%" onclick="copyIdx(' + buf(d.ask) + ')">复制</button></div>';
    B.innerHTML = h;
  }
  else if (kind === 'month') {
    const m = AI_SEC.months.filter(x => x.m === arg)[0];
    T.textContent = arg + ' · ' + m.t;
    let h = '<div class="card"><h3>🎯 ' + esc(m.t) + '</h3><div class="sub">' + esc(m.goal) + '</div>';
    m.tasks.forEach(tk => {
      h += '<div class="row" onclick="asCk(\'' + tk.id + '\')"><span class="num">' + (S.asT[tk.id] ? '<span class="ok">✓</span>' : '○') + '</span><span class="lab">' + esc(tk.txt) + '</span></div>';
    });
    h += '<div class="tiny" style="margin-top:10px">勾选即记在本机。每月预算：每周 5 小时（3 个工作日晚上 ×1h + 周末碎片 2h）。</div></div>';
    B.innerHTML = h;
  }
  else if (kind === 'list') {
    T.textContent = '口语 30 天清单';
    let h = '<div class="card">';
    K30.forEach(d => {
      const k = (2026) + '-' + String(+d.md.split('/')[0]).padStart(2, '0') + '-' + String(+d.md.split('/')[1]).padStart(2, '0');
      const past = dn(k) < dn(today());
      h += '<div class="row" onclick="openDay(' + d.d + ')"><span class="num tiny">' + esc(d.md) + '</span>'
        + '<span class="lab">Day ' + d.d + ' · ' + esc(d.t) + '<div class="tiny">' + (d.out || '') + '</div></span>'
        + '<span class="chip">' + (k === today() ? '今天' : (past ? '已过' : '')) + '</span></div>';
    });
    h += '</div>';
    B.innerHTML = h;
  }
  else if (kind === 'acad') {
    T.textContent = '课程 / 考试 / 截止日';
    let h = '<div class="card"><h3>📚 课程表 · ' + esc(ACAD.term) + '</h3>';
    ACAD.courses.forEach(c => {
      h += '<div class="row"><span class="num">' + c.c + '</span><span class="lab">' + esc(c.n)
        + '<div class="tiny">上课 ' + c.d.map(x => x.slice(5)).join(' · ') + (c.ex ? ' ｜ 考试 ' + c.ex.slice(5) : '') + '</div></span></div>';
    });
    h += '<div class="tiny" style="margin-top:10px">统一周末全天 9:00–12:00 / 13:00–17:30；每门课一结束就考；缺勤超 1/3 必修课需重修。</div></div>';
    h += '<div class="card"><h3>⏰ 硬截止与事件</h3>';
    ACAD.events.forEach(e => {
      const dd = diffDays(today(), e.d);
      h += '<div class="row"><span class="num tiny"' + (e.done ? ' style="color:var(--green)"' : '') + '>' + (e.done ? '✓' : e.d.slice(5)) + '</span>'
        + '<span class="lab"' + (e.done ? ' style="color:var(--dim2)"' : '') + '>' + esc(e.t) + '<div class="tiny">' + e.d.slice(5) + (e.time ? ' ' + e.time : '') + ' · ' + wk(e.d) + ' · '
        + (e.done ? esc(e.note || '已完成') : (dd >= 0 ? dd + ' 天后' : '已过')) + '</div></span></div>';
    });
    h += '</div>';
    h += '<div class="card"><h3>😌 无课周末</h3><div class="tiny">' + ACAD.freebies.map(x => x.slice(5)).join(' · ') + '</div></div>';
    B.innerHTML = h;
  }
  else if (kind === 'dayview') {
    const k = arg;
    T.textContent = fmtMD(k) + ' ' + wk(k);
    const evs = eventsOn(k), dno = dayNoOf(k);
    let h = '';
    h += '<div class="card"><h3>' + (S.ck[k] ? '✅ 已打卡' : (dn(k) < dn(today()) ? '❌ 未打卡' : '· 未来')) + '</h3>';
    if (S.ck[k]) h += '<div class="sub">跟读 ' + mmss(S.ck[k].read || 0) + ' · 对话 ' + mmss(S.ck[k].talk || 0) + ' · 录音 ' + (S.ck[k].rec || 0) + 's · ' + (S.ck[k].full ? '满勤' : '底线') + '</div>';
    else h += '<div class="sub">' + (dn(k) < dn(today()) ? '这天没有打卡记录' : '还没到这一天') + '</div>';
    h += '</div>';
    if (dno) h += '<div class="card"><h3>🎧 口语 Day ' + dno + '</h3><div class="sub">' + esc(kd(dno).t) + '</div><button class="btn pri" style="width:100%" onclick="openDay(' + dno + ')">打开这天</button></div>';
    h += '<div class="card"><h3>📌 这天的事</h3>';
    if (evs.length) evs.forEach(e => { h += '<div class="row"><span class="num">·</span><span class="lab">' + esc(e.t) + '<div class="tiny">' + esc(e.time || '') + '</div></span></div>'; });
    else h += '<div class="sub">没有课 / 考试 / 截止事项</div>';
    h += '</div>';
    B.innerHTML = h;
  }
}
function hideSub() { $('#sub').classList.remove('show'); curSent = -1; }
function openDay(n) { history.pushState({ sub: 'day', arg: n }, ''); showSub('day', n); }
function openMonth(m) { history.pushState({ sub: 'month', arg: m }, ''); showSub('month', m); }
function openList() { history.pushState({ sub: 'list' }, ''); showSub('list'); }
function openAcad() { history.pushState({ sub: 'acad' }, ''); showSub('acad'); }
function openDayView(k) { history.pushState({ sub: 'dayview', arg: k }, ''); showSub('dayview', k); }
const COPYBUF = [];
function buf(s) { COPYBUF.push(String(s == null ? '' : s)); return COPYBUF.length - 1; }
function copyIdx(i) { copyTxt(COPYBUF[i] || ''); }
function selfRec() { S.day.sRec = !S.day.sRec; save(); renderAll(); toast(S.day.sRec ? '已开自证：今日音频听满 2 遍即可' : '已关闭自证'); }
function pauseAudio() { au.pause(); }
function asCk(id) { S.asT[id] = !S.asT[id]; save(); renderAll(); if (curMonthSub) showSub('month', curMonthSub); }
let curMonthSub = '';
function copyTxt(s) {
  const t = typeof s === 'string' ? s : String(s);
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => toast('已复制'), () => toast('复制失败'));
  else { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); toast('已复制'); }
}
function copyAsk(n) { const d = kd(n); if (d) copyTxt(d.ask); }

/* ---------- 主渲染 ---------- */
const TABS = ['today', 'cal', 'plan', 'prog', 'set'];
function renderPane() {
  const t = S.tab || 'today';
  if (t === 'today') renderToday();
  else if (t === 'cal') renderCal();
  else if (t === 'plan') renderPlan();
  else if (t === 'prog') renderProg();
  else renderSet();
  const hasc = t === 'today';
  document.body.classList.toggle('hasc', hasc);
  $('#ck').style.display = hasc ? 'block' : 'none';
}
function renderAll() { rollover(); renderHdr(); renderPane(); if (S.tab === 'today') renderCk(); }
function setTab(t) {
  if (TABS.indexOf(t) < 0) t = 'today';
  S.tab = t; save();
  $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  renderPane(); if (t === 'today') renderCk();
}

/* ---------- 路由 ---------- */
$$('#tabs button').forEach(b => b.addEventListener('click', () => {
  if (b.dataset.t === S.tab) { history.pushState({ t: S.tab }, ''); return; }
  history.pushState({ t: b.dataset.t }, ''); setTab(b.dataset.t);
}));
$('#subBack').addEventListener('click', () => history.back());
history.replaceState({ t: 'today' }, '');
history.pushState({ t: 'today' }, '');
window.addEventListener('popstate', e => {
  const s = e.state || {};
  if (s.sub) { showSub(s.sub, s.arg); return; }
  if (s.t) { hideSub(); setTab(s.t); return; }
  history.pushState({ t: S.tab || 'today' }, '');
  toast('已在首页 · 再按一次返回');
});

/* ---------- 启动 ---------- */
rollover();
try { var _c = JSON.parse(localStorage.getItem('hub_data') || 'null'); if (_c) applyData(_c); } catch (e) { }
setTab(S.tab || 'today');
renderAll();
pullRemote(false);
setInterval(() => { rollover(); renderHdr(); if (S.tab === 'today') renderCk(); }, 30000);
window.addEventListener('focus', () => { rollover(); renderAll(); });

</script>
</body>
</html>
